body{margin:0}
.sl{--font:"Figtree",ui-sans-serif,system-ui,sans-serif;--head:"Bricolage Grotesque",var(--font);
--bg:#f7f7f5;--panel:#fff;--text:#1b1d22;--text-2:#3d414b;--muted:#5d6270;--border:#e3e3de;--border-strong:#c9c9c3;--hover:#efefeb;
--danger:#d93636;--danger-text:#b42323;
font-family:var(--font);font-size:14px;line-height:1.45;color:var(--text);background:var(--bg);min-height:900px}
.sl a{color:inherit;text-decoration:none}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:10px;min-height:60px;padding:0 24px}
.brand{display:inline-flex;align-items:center;gap:8px;font:700 17px var(--head)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.crumbs .here{color:var(--text);font-weight:500}
.ib{width:34px;height:34px;display:grid;place-items:center;border:1px solid transparent;border-radius:6px;background:none;color:var(--muted);cursor:pointer}
.ib:hover{border-color:var(--border);background:var(--panel);color:var(--text)}
.srch{display:flex;align-items:center;gap:8px;height:34px;width:240px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--muted);box-sizing:border-box}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--text)}
.kbd{font-size:11px;border:1px solid var(--border-strong);border-radius:4px;padding:0 5px}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.total{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-top:24px}
.total h1{margin:0;font:700 44px/1 var(--head);letter-spacing:-0.03em}
.total span{color:var(--muted)}
.bar{display:flex;gap:4px;height:44px;margin-top:20px}
.grp{display:flex;gap:2px;min-width:0;border-radius:6px;overflow:hidden}
.seg{display:block;min-width:10px;height:100%;background:var(--c)}
.seg:hover{filter:brightness(1.08) saturate(1.1)}
.seg.dim{opacity:.16 !important}
.seg.on{box-shadow:inset 0 0 0 2px var(--text)}
.glabels{display:flex;gap:4px;margin-top:10px}
.glabels a{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;overflow:hidden}
.glabels b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glabels em{font-style:normal;color:var(--muted)}
.fbar{display:flex;align-items:center;gap:12px;margin-top:28px;flex-wrap:wrap}
.legend{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.lg{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid transparent;border-radius:6px;background:none;font:inherit;font-size:13px;color:var(--text-2);cursor:pointer}
.lg.on{background:var(--hover);border-color:var(--border-strong);color:var(--text)}
.vs{width:10px;height:10px;box-sizing:border-box;display:inline-block;border-radius:2px;flex:none}
.vs.go{background:var(--danger)}
.vs.rv{border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.vs.kp{border:1.5px solid currentColor}
.lg .go{color:var(--danger-text);font-weight:600}
.acts{display:flex;gap:8px;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--border-strong);border-radius:6px;background:var(--panel);color:var(--text);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.list{padding-top:18px;padding-bottom:48px}
.lhead,.row{display:grid;grid-template-columns:16px minmax(170px,1.2fr) minmax(200px,2.2fr) 48px 92px 60px;gap:16px;align-items:center;padding-right:12px}
.lhead{height:32px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border-strong)}
.lhead .r{text-align:right}
.row{min-height:48px;border-bottom:1px solid var(--border)}
.row:hover{background:var(--panel)}
.edge{align-self:stretch;border-radius:2px;background:var(--c)}
.who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-weight:400;color:var(--muted)}
.sum{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-2)}
.d{text-align:right;color:var(--muted);font-size:13px}
.vl{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.vl.go{color:var(--danger-text)}
