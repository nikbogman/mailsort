<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mailsort demo</title>
<meta name="description" content="Live demo of mailsort, a local Gmail sorter, with made-up mail.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
.demo-note { position: fixed; left: 12px; bottom: 12px; z-index: 50; padding: 6px 10px; border-radius: 6px; font: 500 12px/1.4 var(--font); background: var(--toast); color: #fff; opacity: .9; }
.demo-note a { color: inherit; }
</style>
</head>
<body>
<div id="main"></div>
<div class="demo-note">Demo with made-up mail · <a href="https://github.com/nikbogman/mailsort">Get the app</a></div>
<script type="module">import init from "./mailsort.js"; init();</script>
</body>
</html>
