[package]
name = "mailsort"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
dioxus = { version = "0.7.10", features = ["desktop"] }
directories = "6.0.0"
futures = "0.3.34"
open = "5.4.5"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "form", "query", "charset", "http2"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
