[package]
name = "mailsort"
version = "0.4.3"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
dioxus = "0.7.10"
directories = "6.0.0"
futures = "0.3.34"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "form", "query", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
web-time = "1"

# The desktop app.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
open = "5.4.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
self-replace = "1.5.1"
tokio = { version = "1.54.1", features = ["full"] }

# The web demo: same UI, fake data (src/demo/).
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
gloo-timers = { version = "0.3", features = ["futures"] }

[build-dependencies]
winresource = "0.1"
